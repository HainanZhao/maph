name: Research demos · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demos/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/package-lock.json
      - name: Install
        working-directory: demos
        run: npm ci
      - name: Exact engine tests
        working-directory: demos
        run: npm test
      - name: Build multi-page site
        working-directory: demos
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Configure Pages
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: vars.ENABLE_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: demos/dist

  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
